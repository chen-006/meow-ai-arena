<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>炸弹人 · BOMB ARENA</title>
<style>
:root{color-scheme:dark;--muted:#93a3b9;--line:#293347;--accent:#c6ff61}*{box-sizing:border-box}body{margin:0;background:#0a101b;color:#eef2fb;font:15px 'Segoe UI','Microsoft YaHei',sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0;letter-spacing:.04em}h1 small{font-size:12px;color:var(--accent);margin-left:14px;letter-spacing:.16em}.meta{color:var(--muted);font-size:13px}.wrap{max-width:1320px;margin:auto;padding:24px 32px;display:grid;grid-template-columns:minmax(400px,1fr) 290px;gap:24px}.arena{background:#101927;border:1px solid var(--line);border-radius:16px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}#counter{color:white;font-variant-numeric:tabular-nums}canvas{display:block;width:min(100%,740px);height:auto;margin:10px auto}aside{display:flex;flex-direction:column;gap:14px}.card{background:#121c2b;border:1px solid var(--line);border-radius:12px;padding:16px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:12px}.player{display:grid;grid-template-columns:32px 1fr;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid #263144}.player:last-child{border-bottom:0;padding-bottom:0}.avatar{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#0a101b}.name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}.stats{font-size:11px;color:var(--muted);margin-top:4px}.dead{opacity:.42}#status{font-size:23px;font-weight:700;line-height:1.5}#statusSub{color:var(--muted);font-size:12px;line-height:1.8;margin-top:7px}.events{height:140px;overflow:auto;font-size:12px;line-height:1.85;color:#c1cada}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:15px 20px;border-top:1px solid var(--line)}button,select,.file{font:inherit;font-size:12px;border:1px solid #3b485d;border-radius:7px;background:#1c293c;color:#edf3fc;padding:8px 12px;cursor:pointer}button:hover,.file:hover{border-color:var(--accent)}#play{background:var(--accent);border-color:var(--accent);color:#18210a;font-weight:700;min-width:68px}#seek{width:100%;accent-color:var(--accent);margin:0 0 5px}.file input{display:none}.hint{color:var(--muted);font-size:11px;line-height:1.9}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:0 20px 17px}.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}footer{max-width:1320px;margin:auto;padding:0 32px 22px;color:#62758f;font-size:11px}.film header,.film .controls,.film footer,.film .hint{display:none}.film .wrap{padding:15px;max-width:1500px;grid-template-columns:minmax(400px,1fr) 270px}.film canvas{width:min(100%,850px)}@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:14px}.film .wrap{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr}header{padding:16px}.events{height:85px}}
.many #players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.many .player{grid-template-columns:24px minmax(0,1fr);gap:6px;padding:8px 0}.many .avatar{width:24px;height:24px;font-size:12px;border-radius:6px}.many .name{font-size:11px;max-width:100%}.many .stats{font-size:9px;line-height:1.5}.many .wrap{grid-template-columns:minmax(400px,1fr) 340px}.many .events{height:110px}@media(max-width:820px){.many .wrap{grid-template-columns:1fr}.many aside{grid-template-columns:1fr}}
</style></head><body>
<header><h1>炸弹人 <small>BOMB ARENA / 01</small></h1><span class="meta" id="meta">公开规则 · 确定性回放</span></header>
<main class="wrap"><section class="arena"><div class="bar"><span id="mode">加载回放</span><span id="counter">TURN 000 / 000</span></div><canvas id="board" width="780" height="780" aria-label="炸弹人对战棋盘"></canvas><div class="legend"><span><i class="swatch" style="background:#b78a57"></i>可破坏箱子</span><span><i class="swatch" style="background:#ffcb58"></i>火焰</span><span>炸弹数字 = 距引爆行动轮数</span></div><div class="controls"><input id="seek" aria-label="回合进度" type="range" min="0" max="1" value="0"><button id="play">播放</button><button id="prev">上一步</button><button id="next">下一步</button><button id="reset">重播</button><select id="speed" aria-label="播放速度"><option value="2">2 回合/秒</option><option value="5" selected>5 回合/秒</option><option value="10">10 回合/秒</option><option value="20">20 回合/秒</option></select><button id="film">录制模式 F</button><button id="full">全屏</button><label class="file">导入 JSON<input id="file" type="file" accept=".json"></label></div></section>
<aside><div class="card"><div class="label">PLAYERS / 选手</div><div id="players"></div></div><div class="card"><div class="label">MATCH / 战况</div><div id="status">等待开局</div><div id="statusSub"></div></div><div class="card"><div class="label">EVENTS / 回合事件</div><div id="events" class="events"></div></div><div class="card"><div class="label">ACTIONS / 当前步动作</div><div id="actions" class="events"></div></div><div class="hint">空格：播放 / 暂停　← →：逐步<br>F：切换录制模式　R：重播<br>单局分＝生存分＋0.5×击杀份额；同分并列。</div></aside></main><footer>无外部依赖 · 回放中不运行选手代码</footer>
<script>
let data=/*REPLAY_DATA*/null,index=0,playing=false,last=0,acc=0;
const $=s=>document.getElementById(s),ctx=$('board').getContext('2d'),colors=['#62d5ff','#ff7b8d','#c7a2ff','#c6ef66','#ffb65c','#69efd1','#f88dda','#eee2a8','#81a3ff','#f6f7fb'];
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function load(d){if(!d||!Array.isArray(d.frames)||!d.frames.length||!d.result)throw Error('不是有效的回放');data=d;document.body.classList.toggle('many',d.result.config.players>4);index=0;playing=false;acc=0;$('seek').max=d.frames.length-1;$('meta').textContent=`${d.version} · SEED ${d.result.seed}`;const requested=Number(new URLSearchParams(location.hash.slice(1)).get('turn'));if(Number.isFinite(requested)&&requested>0){const found=d.frames.findIndex(f=>f.turn>=requested);index=found<0?d.frames.length-1:found;}draw();}
function draw(){ctx.clearRect(0,0,780,780);if(!data){ctx.fillStyle='#9aa9be';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('导入回放 JSON 开始观看',390,390);return;}
const f=data.frames[index],cfg=data.result.config,n=cfg.size,c=720/n,ox=30,oy=30,flame=new Set(f.flames.map(p=>p[0]+','+p[1]));
for(let y=0;y<n;y++)for(let x=0;x<n;x++){let xx=ox+x*c,yy=oy+y*c,ch=f.board[y][x];rounded(xx+1,yy+1,c-2,c-2,3,ch==='#'?'#344157':(x+y)%2?'#172436':'#1a293d');if(ch==='#'){ctx.fillStyle='#425169';ctx.fillRect(xx+4,yy+4,c-8,3)}if(ch==='+'){rounded(xx+4,yy+4,c-8,c-8,3,'#987347');ctx.strokeStyle='#c39b66';ctx.lineWidth=2;ctx.strokeRect(xx+8,yy+8,c-16,c-16);ctx.beginPath();ctx.moveTo(xx+8,yy+8);ctx.lineTo(xx+c-8,yy+c-8);ctx.stroke();}if(flame.has(x+','+y)){rounded(xx+2,yy+2,c-4,c-4,5,'#d98432');rounded(xx+c*.21,yy+c*.12,c*.58,c*.76,6,'#ffcd61');rounded(xx+c*.36,yy+c*.29,c*.28,c*.42,4,'#fff5b5')}}
for(const b of f.bombs){let xx=ox+(b.x+.5)*c,yy=oy+(b.y+.5)*c;ctx.beginPath();ctx.arc(xx,yy,c*.34,0,Math.PI*2);ctx.fillStyle='#080d16';ctx.fill();ctx.strokeStyle=colors[b.owner];ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${c*.34}px sans-serif`;ctx.fillText(Math.max(0,b.explode_at-f.turn),xx,yy)}
f.players.forEach((p,i)=>{if(!p.alive)return;let xx=ox+(p.x+.5)*c,yy=oy+(p.y+.5)*c;let group=f.players.map((q,j)=>q.alive&&q.x===p.x&&q.y===p.y?j:-1).filter(j=>j>=0),shared=group.length>1;if(shared){let angle=2*Math.PI*group.indexOf(i)/group.length;xx+=Math.cos(angle)*c*.24;yy+=Math.sin(angle)*c*.24}let r=shared?c*.18:c*.32;ctx.shadowBlur=10;ctx.shadowColor=colors[i];rounded(xx-r,yy-r,r*2,r*2,Math.max(4,r*.4),colors[i]);ctx.shadowBlur=0;ctx.fillStyle='#142135';ctx.font=`bold ${c*(shared?.23:.34)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String.fromCharCode(65+i),xx,yy)});
$('actions').replaceChildren();
if(index===0){$('actions').textContent='初始状态，尚未执行动作';}
else {
 const prev=data.frames[index-1], req=f.requested_actions||f.actions||[];
 prev.players.forEach((p,i)=>{if(!p.alive)return;let line=document.createElement('div'),a=req[i],after=f.players[i];
 line.textContent=`${String.fromCharCode(65+i)}：${a?({U:'上',D:'下',L:'左',R:'右',S:'等待'}[a[0]]+(a[1]?'＋放弹':'')):'无有效响应'}；(${p.x},${p.y}) → (${after.x},${after.y})`;
 $('actions').append(line);});
 for(const d of f.diagnostics||[]){let line=document.createElement('div');line.textContent=`${String.fromCharCode(65+d.player)}：${d.error}`;$('actions').append(line);}
}
$('counter').textContent=`TURN ${String(f.turn).padStart(3,'0')} / ${cfg.max_turns}`;$('mode').textContent=`${cfg.players===2?'双人对决':cfg.players+' 人混战'} · ${n} × ${n}`;$('seek').value=index;$('play').textContent=playing?'暂停':'播放';
$('players').replaceChildren();f.players.forEach((p,i)=>{let div=document.createElement('div');div.className='player'+(p.alive?'':' dead');let av=document.createElement('div');av.className='avatar';av.style.background=colors[i];av.textContent=String.fromCharCode(65+i);let info=document.createElement('div'),name=document.createElement('div'),stat=document.createElement('div');name.className='name';name.textContent=data.result.names[i].split(/[\\/]/).pop();stat.className='stats';let active=f.bombs.filter(b=>b.owner===i).length;stat.textContent=p.alive?`存活 · 炸弹 ${active}/${cfg.capacity} · 破箱 ${p.crates}`:`第 ${p.death_turn} 回合淘汰 · ${p.reason}`;if(index===data.frames.length-1&&data.result.kill_credit){stat.textContent+=` · 击杀份额 ${Number(data.result.kill_credit[i]).toFixed(2)}`;if(data.result.points_exact)stat.textContent+=` · 生存分 ${data.result.survival_points[i]}＋击杀分 ${Number(data.result.kill_points[i]).toFixed(2)}＝${data.result.points_exact[i]} 分 · 第 ${data.result.ranks[i]} 名`;}info.append(name,stat);div.append(av,info);$('players').append(div)});
let alive=f.players.filter(p=>p.alive).length,finished=index===data.frames.length-1;
$('status').textContent=finished?(data.result.ranks.filter(r=>r===1).length===1?'胜负已定':'并列结束'):`${alive} 人存活`;
if(finished){$('statusSub').textContent=data.result.ranks.map((r,i)=>`${String.fromCharCode(65+i)}：第 ${r} 名${data.result.points_exact?'（'+data.result.points_exact[i]+'分）':''}`).join('　')}else{let next=f.turn<cfg.shrink_start?cfg.shrink_start:cfg.shrink_start+Math.ceil((f.turn-cfg.shrink_start)/cfg.shrink_every)*cfg.shrink_every;$('statusSub').textContent=`下一次缩圈：第 ${next} 回合\n剩余 ${Math.max(0,next-f.turn)} 回合`}
if(data.result.valid_for_scoring===false){$('status').textContent='无效对局 · 不计成绩';$('statusSub').textContent='存在启动故障，名次仅供诊断。';}
$('events').replaceChildren();let events=[];for(let k=Math.max(0,index-5);k<=index;k++)for(let e of data.frames[k].events||[])events.push([Math.max(0,data.frames[k].turn-1),e]);for(let [t,e] of events.slice(-10).reverse()){let div=document.createElement('div'),who=e.player===undefined?'':String.fromCharCode(65+e.player);div.textContent=`${t} · `+({place:`${who} 放置炸弹`,explode:`${who} 炸弹引爆`,death:`${who} 淘汰（${e.reason}）`,shrink:`边界收缩至第 ${e.layer} 层`,blocked:`${who} 移动受阻，目标 (${(e.target||[]).join(',')})`,kill_credit:`${String.fromCharCode(65+(e.victim||0))} 被击杀；${(e.owners||[]).map(i=>String.fromCharCode(65+i)).join('、')} 各记 ${Number(e.share||0).toFixed(2)}`}[e.type]||e.type);$('events').append(div)}
}
function toggle(){if(!data)return;if(index>=data.frames.length-1)index=0;playing=!playing;acc=0;draw()}
$('play').onclick=toggle;$('prev').onclick=()=>{playing=false;index=Math.max(0,index-1);draw()};$('next').onclick=()=>{playing=false;if(data)index=Math.min(data.frames.length-1,index+1);draw()};$('reset').onclick=()=>{index=0;acc=0;playing=true;draw()};$('seek').oninput=()=>{playing=false;index=+$('seek').value;draw()};$('film').onclick=()=>document.body.classList.toggle('film');$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};$('file').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()))}catch(err){$('status').textContent='回放读取失败';$('statusSub').textContent=String(err)}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click();if(e.key.toLowerCase()==='f')$('film').click();if(e.key.toLowerCase()==='r')$('reset').click()});
function tick(now){if(playing&&data){acc+=Math.min(now-last,250);let step=1000/+$('speed').value;if(acc>=step){let delta=Math.floor(acc/step);index=Math.min(data.frames.length-1,index+delta);acc%=step;if(index===data.frames.length-1)playing=false;draw()}}last=now;requestAnimationFrame(tick)}
if(data)load(data);else draw();requestAnimationFrame(tick);
</script></body></html>
