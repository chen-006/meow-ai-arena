function draw(){ctx.clearRect(0,0,780,780);if(!data){ctx.fillStyle='#9aa9be';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('导入回放 JSON 开始观看',390,390);return;}

for(let y=0;y<n;y++)for(let x=0;x<n;x++){let xx=ox+x*c,yy=oy+y*c,ch=f.board[y][x];rounded(xx+1,yy+1,c-2,c-2,3,ch==='#'?'#344157':(x+y)%2?'#172436':'#1a293d');if(ch==='#'){ctx.fillStyle='#425169';ctx.fillRect(xx+4,yy+4,c-8,3)}if(ch==='+'){rounded(xx+4,yy+4,c-8,c-8,3,'#987347');ctx.strokeStyle='#c39b66';ctx.lineWidth=2;ctx.strokeRect(xx+8,yy+8,c-16,c-16);ctx.beginPath();ctx.moveTo(xx+8,yy+8);ctx.lineTo(xx+c-8,yy+c-8);ctx.stroke();}if(flame.has(x+','+y)){rounded(xx+2,yy+2,c-4,c-4,5,'#d98432');rounded(xx+c*.21,yy+c*.12,c*.58,c*.76,6,'#ffcd61');rounded(xx+c*.36,yy+c*.29,c*.28,c*.42,4,'#fff5b5')}}
for(const b of f.bombs){let xx=ox+(b.x+.5)*c,yy=oy+(b.y+.5)*c;ctx.beginPath();ctx.arc(xx,yy,c*.34,0,Math.PI*2);ctx.fillStyle='#080d16';ctx.fill();ctx.strokeStyle=colors[b.owner];ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${c*.34}px sans-serif`;ctx.fillText(Math.max(0,b.explode_at-f.turn),xx,yy)}
f.players.forEach((p,i)=>{if(!p.alive)return;let xx=ox+(p.x+.5)*c,yy=oy+(p.y+.5)*c;let group=f.players.map((q,j)=>q.alive&&q.x===p.x&&q.y===p.y?j:-1).filter(j=>j>=0),shared=group.length>1;if(shared){let angle=2*Math.PI*group.indexOf(i)/group.length;xx+=Math.cos(angle)*c*.24;yy+=Math.sin(angle)*c*.24}let r=shared?c*.18:c*.32;ctx.shadowBlur=10;ctx.shadowColor=colors[i];rounded(xx-r,yy-r,r*2,r*2,Math.max(4,r*.4),colors[i]);ctx.shadowBlur=0;ctx.fillStyle='#142135';ctx.font=`bold ${c*(shared?.23:.34)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String.fromCharCode(65+i),xx,yy)});
$('actions').replaceChildren();
if(index===0){$('actions').textContent='初始状态，尚未执行动作';}
else {
 const prev=data.frames[index-1], req=f.requested_actions||f.actions||[];
 prev.players.forEach((p,i)=>{if(!p.alive)return;let line=document.createElement('div'),a=req[i],after=f.players[i];
 line.textContent=`${String.fromCharCode(65+i)}：${a?({U:'上',D:'下',L:'左',R:'右',S:'等待'}[a[0]]+(a[1]?'＋放弹':'')):'无有效响应'}；(${p.x},${p.y}) → (${after.x},${after.y})`;
 $('actions').append(line);});
 for(const d of f.diagnostics||[]){let line=document.createElement('div');line.textContent=`${String.fromCharCode(65+d.player)}：${d.error}`;$('actions').append(line);}
}
$('counter').textContent=`TURN ${String(f.turn).padStart(3,'0')} / ${cfg.max_turns}`;$('mode').textContent=`${cfg.players===2?'双人对决':cfg.players+' 人混战'} · ${n} × ${n}`;$('seek').value=index;$('play').textContent=playing?'暂停':'播放';
$('players').replaceChildren();f.players.forEach((p,i)=>{let div=document.createElement('div');div.className='player'+(p.alive?'':' dead');let av=document.createElement('div');av.className='avatar';av.style.background=colors[i];av.textContent=String.fromCharCode(65+i);let info=document.createElement('div'),name=document.createElement('div'),stat=document.createElement('div');name.className='name';name.textContent=data.result.names[i].split(/[\\/]/).pop();stat.className='stats';let active=f.bombs.filter(b=>b.owner===i).length;stat.textContent=p.alive?`存活 · 炸弹 ${active}/${cfg.capacity} · 破箱 ${p.crates}`:`第 ${p.death_turn} 回合淘汰 · ${p.reason}`;if(index===data.frames.length-1&&data.result.kill_credit){stat.textContent+=` · 击杀份额 ${Number(data.result.kill_credit[i]).toFixed(2)}`;if(data.result.points_exact)stat.textContent+=` · 生存分 ${data.result.survival_points[i]}＋击杀分 ${Number(data.result.kill_points[i]).toFixed(2)}＝${data.result.points_exact[i]} 分 · 第 ${data.result.ranks[i]} 名`;}info.append(name,stat);div.append(av,info);$('players').append(div)});
let alive=f.players.filter(p=>p.alive).length,finished=index===data.frames.length-1;
$('status').textContent=finished?(data.result.ranks.filter(r=>r===1).length===1?'胜负已定':'并列结束'):`${alive} 人存活`;
if(finished){$('statusSub').textContent=data.result.ranks.map((r,i)=>`${String.fromCharCode(65+i)}：第 ${r} 名${data.result.points_exact?'（'+data.result.points_exact[i]+'分）':''}`).join('　')}else{let next=f.turn<cfg.shrink_start?cfg.shrink_start:cfg.shrink_start+Math.ceil((f.turn-cfg.shrink_start)/cfg.shrink_every)*cfg.shrink_every;$('statusSub').textContent=`下一次缩圈：第 ${next} 回合\n剩余 ${Math.max(0,next-f.turn)} 回合`}
if(data.result.valid_for_scoring===false){$('status').textContent='无效对局 · 不计成绩';$('statusSub').textContent='存在启动故障，名次仅供诊断。';}
$('events').replaceChildren();let events=[];for(let k=Math.max(0,index-5);k<=index;k++)for(let e of data.frames[k].events||[])events.push([Math.max(0,data.frames[k].turn-1),e]);for(let [t,e] of events.slice(-10).reverse()){let div=document.createElement('div'),who=e.player===undefined?'':String.fromCharCode(65+e.player);div.textContent=`${t} · `+({place:`${who} 放置炸弹`,explode:`${who} 炸弹引爆`,death:`${who} 淘汰（${e.reason}）`,shrink:`边界收缩至第 ${e.layer} 层`,blocked:`${who} 移动受阻，目标 (${(e.target||[]).join(',')})`,kill_credit:`${String.fromCharCode(65+(e.victim||0))} 被击杀；${(e.owners||[]).map(i=>String.fromCharCode(65+i)).join('、')} 各记 ${Number(e.share||0).toFixed(2)}`}[e.type]||e.type);$('events').append(div)}
}
function toggle(){if(!data)return;if(index>=data.frames.length-1)index=0;playing=!playing;acc=0;draw()}
$('play').onclick=toggle;$('prev').onclick=()=>{playing=false;index=Math.max(0,index-1);draw()};$('next').onclick=()=>{playing=false;if(data)index=Math.min(data.frames.length-1,index+1);draw()};$('reset').onclick=()=>{index=0;acc=0;playing=true;draw()};$('seek').oninput=()=>{playing=false;index=+$('seek').value;draw()};$('film').onclick=()=>document.body.classList.toggle('film');$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};$('file').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()))}catch(err){$('status').textContent='回放读取失败';$('statusSub').textContent=String(err)}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click();if(e.key.toLowerCase()==='f')$('film').click();if(e.key.toLowerCase()==='r')$('reset').click()});
function tick(now){if(playing&&data){acc+=Math.min(now-last,250);let step=1000/+$('speed').value;if(acc>=step){let delta=Math.floor(acc/step);index=Math.min(data.frames.length-1,index+delta);acc%=step;if(index===data.frames.length-1)playing=false;draw()}}last=now;requestAnimationFrame(tick)}
if(data)load(data);else draw();requestAnimationFrame(tick);
</script></body></html>
