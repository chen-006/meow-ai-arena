name: RMUC 2026 regression

on:
  pull_request:
    paths:
      - 'rmuc2026/**'
      - '.github/workflows/rmuc2026.yml'
  push:
    paths:
      - 'rmuc2026/**'
      - '.github/workflows/rmuc2026.yml'

permissions:
  contents: read

concurrency:
  group: rmuc2026-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the referee and isolated policy runtime
        run: python rmuc2026/build.py --docker
      - name: Episode, transport and Docker fault regressions
        env:
          RMUC_DOCKER_TESTS: '1'
        run: python -B -m unittest discover -s rmuc2026 -p 'test*.py' -v
