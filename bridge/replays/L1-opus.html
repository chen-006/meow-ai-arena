<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>造桥回放查看器</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1f2328;--mute:#6b7280;--line:#d8dce2;--acc:#2563eb;--bad:#dc2626;--good:#16a34a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto 1fr auto;height:100vh}
#bar{grid-column:1/3;display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar button,#bar select{font:inherit;padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
#bar button:hover{border-color:var(--acc)}
#bar label{display:flex;align-items:center;gap:3px;color:var(--mute);cursor:pointer;user-select:none}
#bar .sep{width:1px;height:20px;background:var(--line)}
#title{font-weight:600;margin-right:6px}
#tlabel{font-variant-numeric:tabular-nums;min-width:150px;color:var(--mute)}
#stage{position:relative;overflow:hidden;background:#fff}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#tip{position:absolute;pointer-events:none;background:rgba(20,24,30,.92);color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;white-space:pre;display:none;z-index:5}
#side{grid-row:2/4;grid-column:2;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:10px 12px}
#side h3{margin:12px 0 6px;font-size:13px;color:var(--mute);font-weight:600}
#side h3:first-child{margin-top:0}
#result{white-space:pre-wrap;font-size:12px;background:#f7f8fa;border-radius:6px;padding:6px 8px}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}
#events,#peaks{list-style:none;margin:0;padding:0;font-size:12px}
#events li,#peaks li{display:flex;gap:6px;padding:2px 4px;border-radius:4px;cursor:pointer;align-items:baseline}
#events li:hover,#peaks li:hover{background:#eef2ff}
#events li.past{color:#9ca3af}
#events li.now{background:#fef3c7}
#events .t{font-variant-numeric:tabular-nums;color:var(--mute);min-width:44px;text-align:right}
#events .dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(1px)}
#sel{font-size:12px}
#spark{width:100%;height:90px;display:block;background:#f7f8fa;border-radius:6px}
#legend{font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center}
#legend i{display:inline-block;width:28px;height:6px;border-radius:3px}
#tl{grid-column:1;height:44px;background:var(--panel);border-top:1px solid var(--line);cursor:pointer;display:block;width:100%}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mute);font-size:15px;background:#fafbfc}
#drop.hover{background:#eef2ff;color:var(--acc)}
#drop b{color:var(--ink)}
.hint{color:var(--mute);font-size:11px}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="title">造桥回放</span>
    <button id="bOpen" title="打开回放 JSON（也可以把文件拖进窗口）">打开回放…</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <button id="bStart" title="回到开头 (Home)">⏮</button>
    <button id="bPrev" title="上一帧 (←，Shift×10)">◀|</button>
    <button id="bPlay" title="播放/暂停 (空格)" style="min-width:58px">播放</button>
    <button id="bNext" title="下一帧 (→，Shift×10)">|▶</button>
    <select id="speed" title="倍速">
      <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
    </select>
    <span id="tlabel"></span>
    <span class="sep"></span>
    <label><input type="checkbox" id="cForce" checked>受力着色</label>
    <label><input type="checkbox" id="cNode">节点编号</label>
    <label><input type="checkbox" id="cMem">杆件编号</label>
    <label><input type="checkbox" id="cGrid" checked>网格</label>
    <button id="bFit" title="恢复视野（双击画面也可以）">适配视野</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="drop"><div>把 <b>回放 JSON</b> 拖到这里，或点左上角「打开回放…」</div>
      <div class="hint">回放由 <code>python bridge.py run &lt;关卡&gt; 设计.json --replay r.json</code> 生成；用 <code>--html r.html</code> 可直接生成带数据的网页</div></div>
  </div>
  <div id="side">
    <h3>结果</h3>
    <div id="result">（未加载）</div>
    <h3>选中的杆件 <span class="hint">（点击画面里的杆件）</span></h3>
    <div id="sel" class="hint">未选中</div>
    <canvas id="spark"></canvas>
    <h3>峰值受力最高的杆件 <span class="hint">（点击跳到峰值时刻）</span></h3>
    <ul id="peaks"></ul>
    <h3>事件 <span class="hint">（点击跳转）</span></h3>
    <ul id="events"></ul>
    <h3>图例</h3>
    <div id="legend"></div>
    <p class="hint">滚轮缩放、拖动平移、双击恢复视野。悬停看杆件下标、材料、当前受力（正=拉，负=压，±100% = 断裂线）。y 轴向上，单位米。</p>
  </div>
  <canvas id="tl"></canvas>
</div>

  {name:'路面', col:'#3d4148', w:0.26},
  {name:'木杆', col:'#a8733a', w:0.15},
  {name:'钢杆', col:'#4f6f8f', w:0.13},
  {name:'钢索', col:'#2b2b2b', w:0.05},
  {name:'弹簧', col:'#2f9e44', w:0.12},
  {name:'液压杆', col:'#e8a317', w:0.20},
  {name:'车架', col:'#888', w:0.06},
];
const VNAME = {car:'小轿车', van:'面包车', truck:'卡车', saboteur:'捣蛋车'};
const VCOL = ['#e8590c','#1c7ed6','#7048e8','#0c8599','#d6336c','#5c940d'];
const FAIL = {0:'',1:'落水/坠落',2:'翻车/车身触地',3:'摔坏（落地太猛）',4:'超时未到',5:'撞船',6:'散架',7:'异常'};
const ANOM = {1:'速度超限',2:'穿模',3:'数值错误',4:'杆件异常拉伸'};
const C_TEN = [37,99,235], C_COMP = [234,120,0], C_RED = [220,20,20], C_NEU = [150,158,168];

// ------------------------------------------------------------ 状态
let R = null, F = [], NP = 0, NB = 0;          // 回放、帧、质点数、桥杆件数
let fpos = 0, playing = false, lastTs = 0;     // fpos：连续帧下标
let view = {cx:0, cy:0, s:30};                 // 世界坐标中心、像素/米
let hover = null, selMem = -1;
let EV = [], PEAK = [], BREAKT = {}, L0 = [];
let sensorNames = null, groupNames = null, lightNames = null, memGroup = null;

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), tl = $('tl'), tctx = tl.getContext('2d');
const spark = $('spark'), sctx = spark.getContext('2d');

// ------------------------------------------------------------ 载入
function load(rep){
  R = rep; F = rep.frames || []; NP = rep.particles.length;
  NB = rep.members.filter(m => m[3] === -1).length;
  $('drop').style.display = 'none';
  const lv = rep.level || {};
  $('title').textContent = `第 ${lv.id ?? '?'} 关「${lv.name ?? ''}」` + (rep.scenario && rep.scenario.name ? ` · ${rep.scenario.name}` : '');
  document.title = `造桥回放 · ${lv.name ?? ''}`;
  // 设计原文（可选字段）：传感器/液压组/红绿灯的名字
  const d = rep.design || null;
  sensorNames = rep.sensors ? rep.sensors.map(s => s.id ?? '') : (d && d.sensors ? d.sensors.map(s => s.id) : null);
  groupNames = rep.groups || (d && d.members ? [...new Set(d.members.filter(m => m[2] === 'hydraulic' && m[3]).map(m => m[3]))].sort() : null);
  lightNames = (rep.lights || []).map((l, i) => l.id ?? (d && d.lights && d.lights[i] ? d.lights[i].id : String(i)));
  memGroup = d && d.members ? d.members.map(m => m[3] || null) : null;
  // 事件
  EV = (rep.events || []).map(parseEvent);
  BREAKT = {};
  for (const e of EV) if (e.type === 'BREAK' && !(e.a[0] in BREAKT)) BREAKT[e.a[0]] = e.t;
  // 峰值
  PEAK = [];
  for (let i = 0; i < NB; i++){
    let pk = 0, pf = 0, sg = 1;
    for (let k = 0; k < F.length; k++){ const s = F[k].s[i]; if (s === 999) break; if (Math.abs(s) > pk){ pk = Math.abs(s); pf = k; sg = Math.sign(s) || 1; } }
    PEAK.push({i, pk, pf, sg, broken: i in BREAKT});
  }
  // 初始长度（第 0 帧）
  L0 = rep.members.map(m => dist(F[0].p, m[0], m[1]));
  fpos = 0; selMem = -1; playing = false;
  fitView(); buildSide(); updateSel(); setPlaying(false); draw();
}
function parseEvent(str){
  const p = String(str).trim().split(/\s+/);
  const t = parseFloat(p[0]), type = p[1] || '?', a = p.slice(2);
  let txt = str, col = '#9ca3af';
  const vn = i => { const v = R.vehicles[+i]; return v ? `车${i}·${v.sab ? '捣蛋车' : (VNAME[v.type] || v.type)}${v.dir > 0 ? '→' : '←'}` : `车${i}`; };
  const mn = i => { const m = R.members[+i]; return m ? `杆件 #${i}（${KIND[m[2]].name}）` : `杆件 #${i}`; };
  switch (type){
    case 'VSTART': txt = `${vn(a[0])} 出发`; col = '#9ca3af'; break;
    case 'VARRIVE': txt = `${vn(a[0])} 到达`; col = '#16a34a'; break;
    case 'VFAIL': txt = `${vn(a[0])} 失败：${FAIL[+a[1]] || a[1]}`; col = '#b91c1c'; break;
    case 'BREAK': { const f = +a[1]; txt = `${mn(a[0])} 断裂（${f >= 0 ? '受拉' : '受压'} ${(Math.abs(f)/1000).toFixed(1)} kN）`; col = '#ef4444'; break; }
    case 'SENSOR': { const s = +a[0]; const nm = sensorNames && sensorNames[s] != null ? `「${sensorNames[s]}」` : `#${s}`; txt = `传感器 ${nm} 触发` + (+a[1] >= 0 ? `：${vn(a[1])}` : ''); col = '#7c3aed'; break; }
    case 'ACT':
      if (a[0] === 'hyd'){ const g = +a[1]; const nm = groupNames && groupNames[g] != null ? `「${groupNames[g]}」` : `#${g}`; txt = `液压组 ${nm} → 建造长度 ×${(+a[2]).toFixed(2)}`; col = '#d97706'; }
      else if (a[0] === 'light'){ const l = +a[1]; txt = `红绿灯「${lightNames[l] ?? l}」变${+a[2] ? '红' : '绿'}`; col = +a[2] ? '#dc2626' : '#16a34a'; }
      else txt = `动作 ${a.join(' ')}`;
      break;
    case 'HORN': txt = '船鸣笛（快到了）'; col = '#0891b2'; break;
    case 'SHIPHIT': txt = `船撞上 ${mn(a[0])}`; col = '#b91c1c'; break;
    case 'ANOMALY': txt = `物理异常：${ANOM[+a[0]] || a[0]} ${a.slice(1).join(' ')}`; col = '#b91c1c'; break;
  }
  return {t, type, a, txt, col, raw:str};
}

// ------------------------------------------------------------ 工具
function dist(p, i, j){ return Math.hypot(p[2*j] - p[2*i], p[2*j+1] - p[2*i+1]); }
function fidx(){ return Math.max(0, Math.min(F.length - 1, Math.floor(fpos + 1e-9))); }
function framePos(){ // 插值后的质点坐标
  const i = fidx(), fr = fpos - i;
  if (fr < 1e-6 || i >= F.length - 1) return F[i].p;
  const a = F[i].p, b = F[i+1].p, out = new Array(a.length);
  for (let k = 0; k < a.length; k++) out[k] = a[k] + (b[k] - a[k]) * fr;
  return out;
}
function curT(){ const i = fidx(); if (!F.length) return 0; const fr = fpos - i; return i < F.length - 1 ? F[i].t + (F[i+1].t - F[i].t) * fr : F[i].t; }
function frameAtT(t){ let lo = 0, hi = F.length - 1; while (lo < hi){ const m = (lo + hi) >> 1; if (F[m].t < t - 1e-6) lo = m + 1; else hi = m; } return lo; }
function W2S(x, y){ return [(x - view.cx) * view.s + cv.clientWidth / 2, cv.clientHeight / 2 - (y - view.cy) * view.s]; }
function S2W(px, py){ return [(px - cv.clientWidth / 2) / view.s + view.cx, (cv.clientHeight / 2 - py) / view.s + view.cy]; }
function mix(a, b, t){ return [0,1,2].map(k => Math.round(a[k] + (b[k] - a[k]) * t)); }
function rgb(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }
function forceColor(s){
  const a = Math.min(Math.abs(s) / 100, 1), base = s >= 0 ? C_TEN : C_COMP;
  if (a < 0.7) return rgb(mix(C_NEU, base, a / 0.7));
  return rgb(mix(base, C_RED, (a - 0.7) / 0.3));
}
function groundY(x){
  let best = null;
  for (const line of (R.level.terrain || [])) for (let k = 0; k + 1 < line.length; k++){
    const [x1, y1] = line[k], [x2, y2] = line[k+1];
    if ((x >= Math.min(x1, x2)) && (x <= Math.max(x1, x2)) && x1 !== x2){ const y = y1 + (y2 - y1) * (x - x1) / (x2 - x1); if (best === null || y > best) best = y; }
  }
  return best ?? 0;
}
function fitView(){
  if (!R) return;
  const lv = R.level, sp = lv.spawn || {left:-10, right:20}, fn = lv.finish || sp, ba = lv.build_area || {x:[0,10], y:[-5,5]};
  const x0 = Math.min(sp.left, fn.left, ba.x[0]) - 3, x1 = Math.max(sp.right, fn.right, ba.x[1]) + 3;
  const y0 = Math.min(lv.kill_y ?? -8, ba.y[0]) - 1, y1 = ba.y[1] + 1.5;
  const W = cv.clientWidth, H = cv.clientHeight;
  view.s = Math.min(W / (x1 - x0), H / (y1 - y0));
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
}

// ------------------------------------------------------------ 绘制
function resize(){
  const dpr = window.devicePixelRatio || 1;
  for (const c of [cv, tl, spark]){ c.width = Math.round(c.clientWidth * dpr); c.height = Math.round(c.clientHeight * dpr); c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
  draw();
}
function path(pts){ ctx.beginPath(); pts.forEach((p, k) => { const [x, y] = W2S(p[0], p[1]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); }

function draw(){
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  if (!R || !F.length){ drawTimeline(); return; }
  const lv = R.level, fi = fidx(), fr = F[fi], P = framePos(), t = curT();
  // 天空
  ctx.fillStyle = '#f8fbff'; ctx.fillRect(0, 0, W, H);
  // 网格
  if ($('cGrid').checked){
    const [wx0, wy1] = S2W(0, 0), [wx1, wy0] = S2W(W, H);
    const step = view.s > 40 ? 1 : view.s > 15 ? 2 : 5;
    ctx.lineWidth = 1; ctx.font = '10px sans-serif'; ctx.fillStyle = '#b6bec8';
    for (let x = Math.ceil(wx0 / step) * step; x <= wx1; x += step){ const [px] = W2S(x, 0); ctx.strokeStyle = x === 0 ? '#c9d2dc' : '#eceff3'; ctx.beginPath(); ctx.moveTo(px + .5, 0); ctx.lineTo(px + .5, H); ctx.stroke(); if (x % (step * 2) === 0) ctx.fillText(x, px + 2, 11); }
    for (let y = Math.ceil(wy0 / step) * step; y <= wy1; y += step){ const [, py] = W2S(0, y); ctx.strokeStyle = y === 0 ? '#c9d2dc' : '#eceff3'; ctx.beginPath(); ctx.moveTo(0, py + .5); ctx.lineTo(W, py + .5); ctx.stroke(); if (y % (step * 2) === 0) ctx.fillText(y, 2, py - 2); }
  }
  // 水
  if (lv.water_y != null){
    const [, wy] = W2S(0, lv.water_y), [, ky] = W2S(0, lv.kill_y ?? lv.water_y - 4);
    const bot = lv.kill_y != null ? ky : H;
    ctx.fillStyle = 'rgba(56,140,220,.22)'; ctx.fillRect(0, wy, W, Math.max(0, bot - wy));
    if (bot < H){ ctx.fillStyle = '#c9b48c'; ctx.fillRect(0, bot, W, H - bot); }
    ctx.strokeStyle = '#3b8fd8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, wy); ctx.lineTo(W, wy); ctx.stroke();
    ctx.fillStyle = '#3b8fd8'; ctx.font = '11px sans-serif'; ctx.fillText(`水面 y=${lv.water_y}（车任何部位低于它 = 落水）`, 6, wy - 4);
    if (lv.kill_y != null){ ctx.setLineDash([4, 4]); ctx.strokeStyle = '#7a8796'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, ky); ctx.lineTo(W, ky); ctx.stroke(); ctx.setLineDash([]); }
  }
  // 地形
  for (const poly of (lv.solid || [])){ path(poly); ctx.closePath(); ctx.fillStyle = '#d9c7a3'; ctx.fill(); }
  ctx.strokeStyle = '#6b5a3c'; ctx.lineWidth = 2;
  for (const line of (lv.terrain || [])){ path(line); ctx.stroke(); }
  // 建造区
  if (lv.build_area){ const b = lv.build_area; const [x0, y1] = W2S(b.x[0], b.y[1]), [x1, y0] = W2S(b.x[1], b.y[0]); ctx.setLineDash([6, 5]); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.strokeRect(x0, y1, x1 - x0, y0 - y1); ctx.setLineDash([]); ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.fillText('建造区', x0 + 4, y1 + 13); }
  // 终点线
  if (lv.finish){ for (const [x, lab] of [[lv.finish.left, '← 终点'], [lv.finish.right, '终点 →']]){ const gy = groundY(x); const [px, py] = W2S(x, gy); ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 3 * view.s); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#16a34a'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(lab, px, py - 3 * view.s - 4); ctx.textAlign = 'left'; } }
  // 船航道
  drawShip(t);
  // 红绿灯
  (R.lights || []).forEach((L, i) => {
    const st = fr.l && fr.l[i] != null ? fr.l[i] : (L.state === 'red' || L.state === 1 ? 1 : 0);
    const gy = groundY(L.x), [px, py] = W2S(L.x, gy), h = 2.4 * view.s;
    ctx.strokeStyle = '#555'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - h); ctx.stroke();
    const r = Math.max(4, 0.22 * view.s);
    ctx.fillStyle = '#222'; ctx.fillRect(px - r * 1.4, py - h - r * 4.6, r * 2.8, r * 4.8);
    ctx.fillStyle = st ? '#ff3b30' : '#4b1d1d'; ctx.beginPath(); ctx.arc(px, py - h - r * 3.4, r, 0, 7); ctx.fill();
    ctx.fillStyle = st ? '#1d3b25' : '#2fd36b'; ctx.beginPath(); ctx.arc(px, py - h - r * 1.2, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#333'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`灯「${lightNames[i]}」${L.dir === 'left' || L.dir === -1 ? '←' : L.dir === 'both' ? '↔' : '→'}`, px, py + 13); ctx.textAlign = 'left';
  });
  // 杆件（桥）
  const useF = $('cForce').checked, order = [3, 4, 5, 1, 2, 0];
  for (const kd of order) for (let i = 0; i < NB; i++){
    const m = R.members[i]; if (m[2] !== kd) continue;
    const s = fr.s[i];
    if (s === 999) continue;
    drawMember(P, i, m, s, useF);
  }
  // 断裂杆件：残桩 + 闪光
  for (let i = 0; i < NB; i++){
    if (fr.s[i] !== 999) continue;
    const m = R.members[i];
    const ax = P[2*m[0]], ay = P[2*m[0]+1], bx = P[2*m[1]], by = P[2*m[1]+1];
    const L = Math.hypot(bx - ax, by - ay) || 1, k = Math.min(0.3, 0.3 * L0[i] / L);
    ctx.strokeStyle = 'rgba(220,38,38,.75)'; ctx.lineWidth = Math.max(1.5, KIND[m[2]].w * view.s * 0.7); ctx.lineCap = 'round';
    for (const [x, y, dx, dy] of [[ax, ay, bx - ax, by - ay], [bx, by, ax - bx, ay - by]]){ const [p1, q1] = W2S(x, y), [p2, q2] = W2S(x + dx * k, y + dy * k); ctx.beginPath(); ctx.moveTo(p1, q1); ctx.lineTo(p2, q2); ctx.stroke(); }
    const dt = t - BREAKT[i];
    if (dt >= 0 && dt < 0.8){
      const [cx, cy] = W2S((ax + bx) / 2, (ay + by) / 2), r = (6 + dt * 40) * Math.max(0.6, view.s / 30);
      ctx.strokeStyle = `rgba(239,68,68,${1 - dt / 0.8})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - 6, cy - 6); ctx.lineTo(cx + 6, cy + 6); ctx.moveTo(cx + 6, cy - 6); ctx.lineTo(cx - 6, cy + 6); ctx.stroke();
    }
  }
  // 节点
  const nb = R.particles.length;
  for (let k = 0; k < nb; k++){
    const pa = R.particles[k]; if (pa.o !== -1) continue;
    const [px, py] = W2S(P[2*k], P[2*k+1]);
    if (k < R.n_anchor){ const r = Math.max(5, 0.28 * view.s); ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.moveTo(px, py - r * .2); ctx.lineTo(px - r, py + r); ctx.lineTo(px + r, py + r); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, Math.max(2.5, r * .35), 0, 7); ctx.fill(); ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5; ctx.stroke(); }
    else { const r = Math.max(2.5, 0.09 * view.s); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill(); ctx.stroke(); }
  }
  // 车辆
  drawVehicles(P, fr);
  // 编号
  ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  if ($('cMem').checked) for (let i = 0; i < NB; i++){ const m = R.members[i]; if (fr.s[i] === 999) continue; const [px, py] = W2S((P[2*m[0]] + P[2*m[1]]) / 2, (P[2*m[0]+1] + P[2*m[1]+1]) / 2); label(String(i), px, py, '#1e3a8a', '#dbeafe'); }
  if ($('cNode').checked) for (let k = 0; k < nb; k++){ if (R.particles[k].o !== -1) continue; const [px, py] = W2S(P[2*k], P[2*k+1]); label(k < R.n_anchor ? 'A' + k : String(k - R.n_anchor), px + 9, py - 9, k < R.n_anchor ? '#fff' : '#111', k < R.n_anchor ? '#334155' : '#fde68a'); }
  ctx.textAlign = 'left';
  // 悬停高亮
  if (hover && hover.kind === 'm'){ const m = R.members[hover.i]; const [x1, y1] = W2S(P[2*m[0]], P[2*m[0]+1]), [x2, y2] = W2S(P[2*m[1]], P[2*m[1]+1]); ctx.strokeStyle = 'rgba(37,99,235,.35)'; ctx.lineWidth = Math.max(10, KIND[m[2]].w * view.s + 8); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  if (selMem >= 0 && fr.s[selMem] !== 999){ const m = R.members[selMem]; const [x1, y1] = W2S(P[2*m[0]], P[2*m[0]+1]), [x2, y2] = W2S(P[2*m[1]], P[2*m[1]+1]); ctx.strokeStyle = '#2563eb'; ctx.setLineDash([5, 4]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]); }
  // HUD：车辆状态
  drawHud(fr, t);
  drawTimeline(); drawSpark(); updateTip(); updateEventsHL(t);
}
function label(txt, x, y, fg, bg){
  const w = ctx.measureText(txt).width + 6;
  ctx.fillStyle = bg; ctx.fillRect(x - w / 2, y - 7, w, 14); ctx.fillStyle = fg; ctx.fillText(txt, x, y + 4);
}
function drawMember(P, i, m, s, useF){
  const [x1, y1] = W2S(P[2*m[0]], P[2*m[0]+1]), [x2, y2] = W2S(P[2*m[1]], P[2*m[1]+1]);
  const K = KIND[m[2]], w = Math.max(m[2] === 3 ? 1.5 : 2.5, K.w * view.s);
  const inner = useF ? forceColor(s) : K.col;
  ctx.lineCap = 'round';
  if (m[2] === 4){ // 弹簧：锯齿
    const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L, nx = -uy, ny = ux, n = 10, a = Math.max(3, w * 0.9);
    ctx.strokeStyle = inner; ctx.lineWidth = Math.max(1.5, w * 0.35); ctx.beginPath(); ctx.moveTo(x1, y1);
    for (let k = 1; k < 2 * n; k++){ const f = 0.1 + 0.8 * k / (2 * n), sg = k % 2 ? 1 : -1; ctx.lineTo(x1 + ux * L * f + nx * a * sg, y1 + uy * L * f + ny * a * sg); }
    ctx.lineTo(x2, y2); ctx.stroke(); return;
  }
  if (m[2] === 5){ // 液压杆：缸筒 + 活塞杆
    const L = Math.hypot(x2 - x1, y2 - y1) || 1, cyl = Math.min(L - 4, L0[i] * view.s * 0.55);
    ctx.strokeStyle = '#6b7280'; ctx.lineWidth = Math.max(2, w * 0.4); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const cx = x1 + (x2 - x1) * cyl / L, cy = y1 + (y2 - y1) * cyl / L;
    ctx.strokeStyle = '#1f2937'; ctx.lineWidth = w + 2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.strokeStyle = useF ? inner : K.col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(cx, cy); ctx.stroke();
    return;
  }
  if (useF){ ctx.strokeStyle = K.col; ctx.lineWidth = w + (m[2] === 3 ? 1 : 3); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  ctx.strokeStyle = inner; ctx.lineWidth = useF ? Math.max(1, w - (m[2] === 0 ? 2 : 0.5)) : w;
  if (m[2] === 0 && !useF){ ctx.strokeStyle = '#3d4148'; }
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function drawVehicles(P, fr){
  (R.vehicles || []).forEach((v, vi) => {
    const st = fr.v ? fr.v[vi] : 1;
    if (st === 2) return; // 已离场
    const col = v.sab ? '#5b21b6' : VCOL[vi % VCOL.length];
    const idx = []; R.particles.forEach((p, k) => { if (p.o === vi) idx.push(k); });
    if (!idx.length) return;
    ctx.globalAlpha = st === 0 ? 0.45 : 1;
    if (!v.sab && v.p0 != null && idx.length >= 4){
      const k = v.p0, pt = j => W2S(P[2*(k+j)], P[2*(k+j)+1]);
      const rw = pt(0), fw = pt(1), rb = pt(2), fb = pt(3);
      ctx.fillStyle = col; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(...rw); ctx.lineTo(...fw); ctx.lineTo(...fb); ctx.lineTo(...rb); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else { // 通用：画车架杆件
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      R.members.forEach(m => { if (m[3] === vi){ const a = W2S(P[2*m[0]], P[2*m[0]+1]), b = W2S(P[2*m[1]], P[2*m[1]+1]); ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); } });
    }
    for (const k of idx){ const pa = R.particles[k]; const [px, py] = W2S(P[2*k], P[2*k+1]); const r = Math.max(2, pa.r * view.s);
      if (pa.k === 1){ ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill(); ctx.fillStyle = '#d1d5db'; ctx.beginPath(); ctx.arc(px, py, r * .4, 0, 7); ctx.fill(); }
      else if (v.sab || v.p0 == null){ ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.stroke(); } }
    // 标签
    let cx = 0, cy = -1e9; for (const k of idx){ cx += P[2*k]; cy = Math.max(cy, P[2*k+1]); } cx /= idx.length;
    const [lx, ly] = W2S(cx, cy); ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = st === 3 ? '#b91c1c' : '#111'; ctx.fillText(`车${vi}${st === 3 ? ' ✗' : ''}`, lx, ly - 14); ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  });
}
function drawShip(t){
  const sh = R.ship; if (!sh) return;
  const [x0, y1] = W2S(sh.x[0], sh.y[1]), [x1, y0] = W2S(sh.x[1], sh.y[0]);
  const on = t >= sh.t && t <= sh.t + sh.dur, horn = t >= sh.t - sh.lead && t < sh.t;
  ctx.setLineDash([5, 4]); ctx.strokeStyle = on ? '#dc2626' : '#0891b2'; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y1, x1 - x0, y0 - y1); ctx.setLineDash([]);
  if (on){ ctx.fillStyle = 'rgba(220,38,38,.12)'; ctx.fillRect(x0, y1, x1 - x0, y0 - y1);
    // 船（正面剪影）
    const cx = (x0 + x1) / 2, w = (x1 - x0) * 0.8, base = y0, h = (y0 - y1);
    ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.moveTo(cx - w / 2, base - h * .35); ctx.lineTo(cx + w / 2, base - h * .35); ctx.lineTo(cx + w * .35, base); ctx.lineTo(cx - w * .35, base); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(cx - w * .25, base - h * .7, w * .5, h * .35);
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, base - h * .7); ctx.lineTo(cx, y1 + 4); ctx.stroke(); }
  ctx.fillStyle = on ? '#dc2626' : '#0891b2'; ctx.font = '11px sans-serif';
  ctx.fillText(on ? `船通过中（${(sh.t + sh.dur - t).toFixed(1)} 秒后离开）` : horn ? `船鸣笛！${(sh.t - t).toFixed(1)} 秒后到` : t < sh.t ? `船航道（${sh.t} 秒到）` : '船航道（已过）', x0 + 3, y1 - 4);
}
function drawHud(fr, t){
  ctx.font = '12px "Microsoft YaHei",sans-serif';
  let y = 18;
  (R.vehicles || []).forEach((v, vi) => {
    const st = fr.v ? fr.v[vi] : 0;
    let s = ['等待出发', '行驶中', '已到达', '失败'][st] || '?';
    if (st === 3){ const e = EV.find(e => e.type === 'VFAIL' && +e.a[0] === vi); if (e) s += '：' + (FAIL[+e.a[1]] || ''); }
    const txt = `车${vi} ${v.sab ? '捣蛋车' : VNAME[v.type] || v.type} ${v.dir > 0 ? '→' : '←'} ${Math.round(v.mass)}kg  ${s}`;
    const w = ctx.measureText(txt).width + 22;
    ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillRect(8, y - 13, w, 18);
    ctx.fillStyle = v.sab ? '#5b21b6' : VCOL[vi % VCOL.length]; ctx.fillRect(12, y - 8, 8, 8);
    ctx.fillStyle = st === 3 ? '#b91c1c' : st === 2 ? '#15803d' : '#111'; ctx.fillText(txt, 25, y);
    y += 20;
  });
  // 当前最大受力
  let mx = 0, mi = -1; for (let i = 0; i < NB; i++){ const s = fr.s[i]; if (s !== 999 && Math.abs(s) > mx){ mx = Math.abs(s); mi = i; } }
  const nbk = fr.s.slice(0, NB).filter(s => s === 999).length;
  const txt = `此刻受力最大：#${mi}  ${mx.toFixed(0)}%   已断 ${nbk} 根`;
  const w = ctx.measureText(txt).width + 12; ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillRect(8, y - 13, w, 18);
  ctx.fillStyle = mx > 85 ? '#b91c1c' : '#374151'; ctx.fillText(txt, 14, y);
}

// ------------------------------------------------------------ 时间轴
function drawTimeline(){
  const W = tl.clientWidth, H = tl.clientHeight; tctx.clearRect(0, 0, W, H);
  tctx.fillStyle = '#fff'; tctx.fillRect(0, 0, W, H);
  if (!F.length) return;
  const t0 = F[0].t, t1 = F[F.length - 1].t, X = t => 12 + (W - 24) * (t - t0) / (t1 - t0 || 1);
  tctx.fillStyle = '#e5e7eb'; tctx.fillRect(12, 20, W - 24, 6);
  tctx.fillStyle = '#93c5fd'; tctx.fillRect(12, 20, X(curT()) - 12, 6);
  for (const e of EV){ tctx.fillStyle = e.col; const x = X(e.t); tctx.fillRect(x - 1, e.type === 'BREAK' ? 8 : 12, 2, e.type === 'BREAK' ? 10 : 6); }
  tctx.font = '10px sans-serif'; tctx.fillStyle = '#9ca3af';
  for (let s = Math.ceil(t0); s <= t1; s++){ const x = X(s); tctx.fillRect(x, 28, 1, 4); tctx.fillText(s + 's', x - 6, 41); }
  const x = X(curT()); tctx.fillStyle = '#2563eb'; tctx.beginPath(); tctx.arc(x, 23, 6, 0, 7); tctx.fill();
}
function seekX(px){ const W = tl.clientWidth, t0 = F[0].t, t1 = F[F.length - 1].t; const t = t0 + (t1 - t0) * (px - 12) / (W - 24); fpos = Math.max(0, Math.min(F.length - 1, (t - t0) / (t1 - t0) * (F.length - 1))); draw(); }

// ------------------------------------------------------------ 侧栏
function buildSide(){
  const ok = R.result && R.result.ok;
  $('result').innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${ok ? '通过' : '失败'}</span>　造价 ${R.cost != null ? Math.round(R.cost) : '?'}${R.level.budget ? ' / ' + R.level.budget : ''}\n` + escapeHtml((R.result && R.result.text) || '');
  const ul = $('events'); ul.innerHTML = '';
  EV.forEach((e, k) => { const li = document.createElement('li'); li.dataset.k = k; li.innerHTML = `<span class="t">${e.t.toFixed(2)}</span><span class="dot" style="background:${e.col}"></span><span>${escapeHtml(e.txt)}</span>`; li.title = e.raw; li.onclick = () => { seekT(e.t, e.type === 'BREAK'); if (e.type === 'BREAK' || e.type === 'SHIPHIT'){ selMem = +e.a[0]; updateSel(); } draw(); }; ul.appendChild(li); });
  const pk = $('peaks'); pk.innerHTML = '';
  [...PEAK].sort((a, b) => (b.broken - a.broken) || (b.pk - a.pk)).slice(0, 10).forEach(p => {
    const m = R.members[p.i], li = document.createElement('li');
    li.innerHTML = `<span style="min-width:40px">#${p.i}</span><span style="min-width:44px">${KIND[m[2]].name}</span><span class="${p.broken ? 'bad' : p.pk > 85 ? 'bad' : ''}">${p.broken ? `断裂 @${BREAKT[p.i].toFixed(2)}s` : `峰值 ${p.pk.toFixed(0)}%（${p.sg > 0 ? '拉' : '压'}）`}</span>`;
    li.onclick = () => { selMem = p.i; updateSel(); if (p.broken) seekT(BREAKT[p.i], true); else fpos = p.pf; draw(); };
    pk.appendChild(li);
  });
  const lg = $('legend'); lg.innerHTML = '';
  const add = (sw, txt) => { lg.insertAdjacentHTML('beforeend', `<span>${sw}</span><span>${txt}</span>`); };
  add(`<i style="background:linear-gradient(90deg,${rgb(C_NEU)},${rgb(C_TEN)},${rgb(C_RED)})"></i>`, '受拉：灰 → 蓝 → 红（接近 100% 断裂线）');
  add(`<i style="background:linear-gradient(90deg,${rgb(C_NEU)},${rgb(C_COMP)},${rgb(C_RED)})"></i>`, '受压：灰 → 橙 → 红');
  for (const k of [0, 1, 2, 3, 4, 5]) add(`<i style="background:${KIND[k].col};height:${Math.max(2, KIND[k].w * 24)}px"></i>`, `${KIND[k].name}（外框颜色）`);
  add('<i style="background:#dc2626;height:3px"></i>', '断裂杆件残桩（红）');
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function seekT(t, before){ let k = frameAtT(t); if (before) k = Math.max(0, k - 1); fpos = k; }
function updateEventsHL(t){
  const lis = $('events').children; let nowK = -1;
  for (let k = 0; k < EV.length; k++) if (EV[k].t <= t + 1e-6) nowK = k;
  for (let k = 0; k < lis.length; k++){ lis[k].classList.toggle('past', k < nowK && EV[k].t < t - 0.5); lis[k].classList.toggle('now', EV[k].t <= t + 1e-6 && EV[k].t > t - 0.5); }
}
function memName(i){
  const m = R.members[i]; if (m[3] !== -1) return `车${m[3]} 车架`;
  const g = memGroup && memGroup[i] ? `，液压组「${memGroup[i]}」` : '';
  return `杆件 #${i}　${KIND[m[2]].name}${g}`;
}
function updateSel(){
  if (selMem < 0 || !R){ $('sel').textContent = '未选中'; $('sel').className = 'hint'; drawSpark(); return; }
  const m = R.members[selMem], p = PEAK[selMem];
  $('sel').className = '';
  $('sel').innerHTML = `<b>${escapeHtml(memName(selMem))}</b><br>节点 ${nodeName(m[0])} — ${nodeName(m[1])}，长 ${L0[selMem].toFixed(2)} m<br>` +
    (p ? (p.broken ? `<span class="bad">在 ${BREAKT[selMem].toFixed(2)} 秒断裂</span>` : `峰值 ${p.pk.toFixed(0)}%（${p.sg > 0 ? '拉' : '压'}，t=${F[p.pf].t.toFixed(2)}s）`) : '');
  drawSpark();
}
function nodeName(k){ if (k < R.n_anchor) return 'A' + k; if (R.particles[k].o === -1) return String(k - R.n_anchor); return `车${R.particles[k].o}质点`; }
function drawSpark(){
  const W = spark.clientWidth, H = spark.clientHeight; sctx.clearRect(0, 0, W, H);
  if (selMem < 0 || !F.length) { sctx.fillStyle = '#9ca3af'; sctx.font = '11px sans-serif'; sctx.fillText('选中杆件后显示受力随时间变化', 8, H / 2 + 4); return; }
  const Y = v => H / 2 - v / 150 * (H / 2 - 4), X = k => 4 + (W - 8) * k / (F.length - 1);
  sctx.fillStyle = 'rgba(220,38,38,.08)'; sctx.fillRect(0, 0, W, Y(100)); sctx.fillRect(0, Y(-100), W, H - Y(-100));
  sctx.strokeStyle = '#e5e7eb'; sctx.beginPath(); sctx.moveTo(0, Y(0)); sctx.lineTo(W, Y(0)); sctx.stroke();
  sctx.strokeStyle = '#fca5a5'; sctx.setLineDash([3, 3]); for (const v of [100, -100]){ sctx.beginPath(); sctx.moveTo(0, Y(v)); sctx.lineTo(W, Y(v)); sctx.stroke(); } sctx.setLineDash([]);
  sctx.strokeStyle = '#2563eb'; sctx.lineWidth = 1.5; sctx.beginPath(); let started = false;
  for (let k = 0; k < F.length; k++){ const s = F[k].s[selMem]; if (s === 999) break; const x = X(k), y = Y(Math.max(-150, Math.min(150, s))); started ? sctx.lineTo(x, y) : sctx.moveTo(x, y); started = true; }
  sctx.stroke();
  sctx.fillStyle = '#9ca3af'; sctx.font = '10px sans-serif'; sctx.fillText('+100% 拉', 4, Y(100) - 2); sctx.fillText('-100% 压', 4, Y(-100) + 10);
  const x = X(fpos); sctx.strokeStyle = '#111'; sctx.lineWidth = 1; sctx.beginPath(); sctx.moveTo(x, 0); sctx.lineTo(x, H); sctx.stroke();
}

// ------------------------------------------------------------ 悬停
let mouse = null;
function pick(mx, my){
  if (!R || !F.length) return null;
  const P = framePos(), fr = F[fidx()];
  let best = null, bd = 9;
  R.particles.forEach((pa, k) => { if (pa.o !== -1) return; const [px, py] = W2S(P[2*k], P[2*k+1]); const d = Math.hypot(px - mx, py - my); if (d < bd){ bd = d; best = {kind:'n', i:k}; } });
  if (best) return best;
  bd = 7;
  R.members.forEach((m, i) => {
    if (fr.s[i] === 999) return;
    const [x1, y1] = W2S(P[2*m[0]], P[2*m[0]+1]), [x2, y2] = W2S(P[2*m[1]], P[2*m[1]+1]);
    const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy || 1; let u = ((mx - x1) * dx + (my - y1) * dy) / L2; u = Math.max(0, Math.min(1, u));
    const d = Math.hypot(x1 + u * dx - mx, y1 + u * dy - my) - (m[3] === -1 ? KIND[m[2]].w * view.s / 2 : 0);
    if (d < bd || (m[3] === -1 && best && best.veh && d < bd + 4)){ bd = d; best = {kind:'m', i, veh: m[3] !== -1}; }
  });
  return best;
}
function updateTip(){
  const tip = $('tip');
  if (!mouse || !hover || !R){ tip.style.display = 'none'; return; }
  const fr = F[fidx()], P = framePos(); let txt = '';
  if (hover.kind === 'n'){ const k = hover.i; txt = `${k < R.n_anchor ? '锚点 A' + k : '节点 ' + (k - R.n_anchor)}\n(${P[2*k].toFixed(2)}, ${P[2*k+1].toFixed(2)})`; }
  else { const i = hover.i, m = R.members[i], s = fr.s[i];
    txt = memName(i) + (m[3] === -1 ? `\n当前受力 ${s > 0 ? '+' : ''}${s}%（${s >= 0 ? '拉' : '压'}）` : '');
    if (m[3] === -1){ const p = PEAK[i]; txt += `\n长 ${L0[i].toFixed(2)} m（当前 ${dist(P, m[0], m[1]).toFixed(2)}）\n节点 ${nodeName(m[0])} — ${nodeName(m[1])}`; if (p) txt += p.broken ? `\n${BREAKT[i].toFixed(2)} 秒断裂` : `\n本回放峰值 ${p.pk.toFixed(0)}%`; } }
  tip.textContent = txt; tip.style.display = 'block';
  const st = $('stage').getBoundingClientRect();
  let x = mouse[0] + 14, y = mouse[1] + 14; if (x + tip.offsetWidth > st.width) x = mouse[0] - tip.offsetWidth - 10; if (y + tip.offsetHeight > st.height) y = mouse[1] - tip.offsetHeight - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

// ------------------------------------------------------------ 交互
function setPlaying(p){ playing = p && !!F.length; if (playing && fpos >= F.length - 1) fpos = 0; $('bPlay').textContent = playing ? '暂停' : '播放'; lastTs = 0; if (playing) requestAnimationFrame(tick); }
function tick(ts){
  if (!playing) return;
  if (lastTs){ const dt = Math.min(0.1, (ts - lastTs) / 1000); fpos += dt * 30 * parseFloat($('speed').value); if (fpos >= F.length - 1){ fpos = F.length - 1; setPlaying(false); } }
  lastTs = ts; draw(); if (playing) requestAnimationFrame(tick);
}
function step(n){ setPlaying(false); fpos = Math.max(0, Math.min(F.length - 1, Math.round(fpos) + n)); draw(); }
function tlabel(){ if (!F.length) return ''; return `t = ${curT().toFixed(2)} s　帧 ${fidx()}/${F.length - 1}`; }
const _draw = draw; draw = function(){ _draw(); $('tlabel').textContent = tlabel(); };

$('bOpen').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if (f) readFile(f); };
function readFile(f){ const rd = new FileReader(); rd.onload = () => { try { load(JSON.parse(rd.result)); } catch (err){ alert('读取失败：' + err.message); } }; rd.readAsText(f, 'utf-8'); }
const stage = $('stage');
['dragenter', 'dragover'].forEach(n => window.addEventListener(n, e => { e.preventDefault(); $('drop').classList.add('hover'); }));
window.addEventListener('dragleave', e => { $('drop').classList.remove('hover'); });
window.addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('hover'); const f = e.dataTransfer.files[0]; if (f) readFile(f); });
$('bPlay').onclick = () => setPlaying(!playing);
$('bPrev').onclick = e => step(e.shiftKey ? -10 : -1);
$('bNext').onclick = e => step(e.shiftKey ? 10 : 1);
$('bStart').onclick = () => { setPlaying(false); fpos = 0; draw(); };
$('bFit').onclick = () => { fitView(); draw(); };
for (const id of ['cForce', 'cNode', 'cMem', 'cGrid']) $(id).onchange = () => draw();
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  if (e.code === 'Space'){ e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); step(e.shiftKey ? -10 : -1); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); step(e.shiftKey ? 10 : 1); }
  else if (e.key === 'Home'){ fpos = 0; draw(); } else if (e.key === 'End'){ fpos = F.length - 1; draw(); }
});
let drag = null;
cv.addEventListener('mousedown', e => { drag = {x:e.offsetX, y:e.offsetY, cx:view.cx, cy:view.cy, moved:false}; });
window.addEventListener('mouseup', e => {
  if (drag && !drag.moved && R){ const h = pick(drag.x, drag.y); selMem = h && h.kind === 'm' && R.members[h.i][3] === -1 ? h.i : -1; updateSel(); draw(); }
  drag = null;
});
cv.addEventListener('mousemove', e => {
  mouse = [e.offsetX, e.offsetY];
  if (drag){ const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; if (drag.moved){ view.cx = drag.cx - dx / view.s; view.cy = drag.cy + dy / view.s; } }
  hover = drag && drag.moved ? null : pick(e.offsetX, e.offsetY); draw();
});
cv.addEventListener('mouseleave', () => { mouse = null; hover = null; draw(); });
cv.addEventListener('wheel', e => { e.preventDefault(); const [wx, wy] = S2W(e.offsetX, e.offsetY); const f = Math.exp(-e.deltaY * 0.0015); view.s = Math.max(3, Math.min(400, view.s * f)); const [wx2, wy2] = S2W(e.offsetX, e.offsetY); view.cx += wx - wx2; view.cy += wy - wy2; draw(); }, {passive:false});
cv.addEventListener('dblclick', () => { fitView(); draw(); });
let tdrag = false;
tl.addEventListener('mousedown', e => { if (!F.length) return; tdrag = true; setPlaying(false); seekX(e.offsetX); });
window.addEventListener('mousemove', e => { if (tdrag){ const r = tl.getBoundingClientRect(); seekX(e.clientX - r.left); } });
window.addEventListener('mouseup', () => { tdrag = false; });
window.addEventListener('resize', resize);

resize();
if (EMBED) load(EMBED);
</script>
</body>
