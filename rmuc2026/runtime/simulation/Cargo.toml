[package]
name = "rmuc-sim"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
sha2 = "0.10"
rapier3d = { package = "rapier3d-f64", version = "=0.26.1", features = ["enhanced-determinism", "serde-serialize"] }

[profile.release]
lto = true
codegen-units = 1
