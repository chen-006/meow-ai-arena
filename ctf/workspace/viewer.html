<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>夺旗回放</title>
<style>
:root{color-scheme:dark;--bg:#0f141c;--panel:#18202c;--line:#2a3547;--ink:#e6ecf5;--muted:#93a1b5;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;margin-bottom:12px}h1{font-size:22px;margin:0}.muted{color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:minmax(360px,1fr) 340px;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
canvas{width:100%;display:block;border-radius:6px;background:#121a26}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
button,select,input{background:#253247;color:var(--ink);border:1px solid #3c4d68;border-radius:6px;padding:6px 9px;font:inherit;font-size:13px}
button{cursor:pointer}button:hover{background:#30405a}input[type=range]{flex:1;min-width:160px;padding:0}
.team{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}.team:hover,.team.on{background:#243044}
.team b{font-size:16px}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
h2{font-size:13px;color:var(--muted);margin:12px 0 6px}#events,#orders{font-size:12px;line-height:1.7;max-height:190px;overflow:auto;white-space:pre-wrap}
@media(max-width:860px){.layout{grid-template-columns:1fr}body{padding:10px}}
</style></head><body>
<header><h1>夺旗回放</h1><span class="muted" id="sub"></span></header>
<div class="layout">
<section class="panel"><canvas id="board"></canvas>
<div class="controls"><button id="play">播放</button><button id="prev">◀</button><button id="next">▶</button>
<input id="seek" type="range" min="0" value="0" aria-label="回合"><span id="turn"></span>
<select id="speed" aria-label="速度"><option value="1">1×</option><option value="3" selected>3×</option><option value="8">8×</option><option value="20">20×</option></select></div>
<div class="controls"><select id="keys" aria-label="关键回合"><option value="">跳到关键回合…</option></select></div>
<div class="muted" style="margin-top:8px">圆点 = 角色（数字为 id），金环 = 携旗，星形 = 地上的旗，淡色方块 = 基地，虚线圈 = 旗点。点右侧阵营可高亮。←→ 逐回合，空格播放。</div>
</section>
<aside class="panel"><h2>阵营与得分</h2><div id="teams"></div><h2>本回合事件</h2><div id="events"></div><h2>指令</h2><div id="orders"></div></aside>
</div>
<script>
const R=/*__REPLAY__*/null;
const C=['#ff6b7f','#5ab4ff','#7bd99b','#d7a2ff','#ffcb6b','#5fd9d4','#ff9fd0','#b5cc6e','#a9aeff','#f09c63','#e0e0e0','#8fb3c9','#e8d38a','#c98fa8','#8fd6b2'];
const $=id=>document.getElementById(id),cv=$('board'),g=cv.getContext('2d');
let i=0,playing=false,last=0,focus=-1;
const MV={N:'上',S:'下',E:'右',W:'左',WAIT:'停'},AC={attack:'攻击',pickup:'拾旗',drop:'丢旗',wait:''};
const name=t=>R.names[t]??('阵营'+t);
function ev(e){switch(e.type){case'capture':return`★ ${name(e.team)} 交旗（角色${e.unit}，旗${e.flag}）`;case'pickup':return`角色${e.unit} 拿到旗${e.flag}`;case'drop':return`角色${e.unit} 放下旗${e.flag}`;case'death':return`✖ 角色${e.unit} 阵亡${e.flag!==null?'，掉落旗'+e.flag:''}（击杀：${e.by.join('、')}）`;case'attack':return`角色${e.unit} → 角色${e.target}`;case'respawn':return`角色${e.unit} 重生`;case'return':return`旗${e.flag} 回位`;default:return JSON.stringify(e)}}
function render(){
 const f=R.frames[i],H=R.header,n=H.size,s=Math.max(10,Math.floor(760/n));cv.width=cv.height=n*s;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){g.fillStyle=H.map[y][x]==='#'?'#3e4c63':((x+y)%2?'#16202e':'#182333');g.fillRect(x*s,y*s,s,s)}
 H.bases.forEach((b,t)=>{g.fillStyle=C[t%15]+(focus<0||focus===t?'55':'22');for(const[x,y]of b)g.fillRect(x*s,y*s,s,s)});
 g.setLineDash([3,3]);g.strokeStyle='#ffe08a88';for(const[x,y]of H.flag_spots){g.beginPath();g.arc((x+.5)*s,(y+.5)*s,s*.42,0,7);g.stroke()}g.setLineDash([]);
 for(const e of f.events)if(e.type==='attack'){const a=f.units[e.unit],b=f.units[e.target];const pa=a.pos,pb=b.pos||(f.events.find(z=>z.type==='death'&&z.unit===e.target)||{}).pos;if(pa&&pb){g.strokeStyle='#ffe7a0';g.lineWidth=2;g.beginPath();g.moveTo((pa[0]+.5)*s,(pa[1]+.5)*s);g.lineTo((pb[0]+.5)*s,(pb[1]+.5)*s);g.stroke()}}
 for(const fl of f.flags)if(fl.pos){const[x,y]=fl.pos;star((x+.5)*s,(y+.5)*s,s*.38,'#ffd75e')}
 for(const e of f.events)if(e.type==='death'){const[x,y]=e.pos;g.strokeStyle='#ffb070';g.lineWidth=2;g.beginPath();g.moveTo(x*s+3,y*s+3);g.lineTo(x*s+s-3,y*s+s-3);g.moveTo(x*s+s-3,y*s+3);g.lineTo(x*s+3,y*s+s-3);g.stroke()}
 for(const u of f.units){if(!u.pos)continue;const t=Math.floor(u.id/3),[x,y]=u.pos,cx=(x+.5)*s,cy=(y+.5)*s;g.globalAlpha=focus<0||focus===t?1:.25;
  g.fillStyle=C[t%15];g.beginPath();g.arc(cx,cy,s*.36,0,7);g.fill();if(u.flag!==null){g.strokeStyle='#ffd75e';g.lineWidth=3;g.beginPath();g.arc(cx,cy,s*.48,0,7);g.stroke()}
  g.fillStyle='#0b111a';g.font=`bold ${Math.max(8,s*.36)}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(u.id,cx,cy+1);
  g.fillStyle='#0b111a';g.fillRect(x*s+2,y*s+1,s-4,2);g.fillStyle=u.hp>50?'#8fe3b5':'#ffc56b';g.fillRect(x*s+2,y*s+1,(s-4)*u.hp/H.rules.hp,2)}
 g.globalAlpha=1;
 $('turn').textContent=`${f.turn} / ${R.frames.at(-1).turn}`;$('seek').value=i;
 const order=[...Array(H.teams).keys()].sort((a,b)=>f.score[b]-f.score[a]);
 $('teams').replaceChildren(...order.map(t=>{const d=document.createElement('div');d.className='team'+(focus===t?' on':'');d.onclick=()=>{focus=focus===t?-1:t;render()};
  const alive=f.units.filter(u=>Math.floor(u.id/3)===t).map(u=>u.pos?(u.flag!==null?'⚑':'●'):'○').join('');
  d.innerHTML=`<span><span class="sw" style="background:${C[t%15]}"></span>${esc(name(t))} <span class="muted">${alive}</span></span><b>${f.score[t]}</b>`;return d}));
 $('events').textContent=f.events.filter(e=>e.type!=='attack'||focus<0||Math.floor(e.unit/3)===focus).map(ev).join('\n')+(f.faults?'\n'+f.faults.map(x=>`程序故障 ${name(x.team)}：${x.reason}`).join('\n'):'')||'无';
 $('orders').textContent=Object.entries(f.orders).filter(([t])=>focus<0||+t===focus).map(([t,cs])=>`${name(+t)}：`+cs.map(c=>`${c.id} ${MV[c.move]??'停'}${AC[c.act]?' '+AC[c.act]:''}${c.act==='attack'?' '+c.target:''}${c.note?'「'+c.note+'」':''}`).join('，')).join('\n')||'—';
}
function star(x,y,r,col){g.fillStyle=col;g.beginPath();for(let k=0;k<10;k++){const a=Math.PI/5*k-Math.PI/2,rr=k%2?r*.45:r;g.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a))}g.fill()}
function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function go(k){playing=false;$('play').textContent='播放';i=Math.max(0,Math.min(R.frames.length-1,k));render()}
function tick(t){if(playing&&t-last>=300/+$('speed').value){last=t;if(i<R.frames.length-1){i++;render()}else go(i)}requestAnimationFrame(tick)}
if(R){
 $('sub').textContent=`${R.header.teams} 方 · 地图 ${R.header.size}×${R.header.size} · 种子 ${R.header.seed} · 最终得分 ${R.result.score.join(' / ')}`;
 $('seek').max=R.frames.length-1;
 R.frames.forEach((f,k)=>{const es=f.events.filter(e=>e.type==='capture'||(e.type==='death'&&e.flag!==null));if(es.length){const o=document.createElement('option');o.value=k;o.textContent=`${f.turn} 回合：${es.map(ev).join('；')}`;$('keys').append(o)}});
 $('play').onclick=()=>{if(i===R.frames.length-1)i=0;playing=!playing;$('play').textContent=playing?'暂停':'播放'};
 $('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('seek').oninput=e=>go(+e.target.value);$('keys').onchange=e=>{if(e.target.value!=='')go(+e.target.value)};
 addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);if(e.key===' '){e.preventDefault();$('play').click()}});
 render();requestAnimationFrame(tick)
}else $('sub').textContent='这是回放模板，请打开对战后生成的 HTML 文件。';
</script></body></html>
