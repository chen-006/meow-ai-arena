<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>夺旗回放</title>
<style>
:root{color-scheme:dark;--bg:#0f141c;--panel:#18202c;--line:#2a3547;--ink:#e6ecf5;--muted:#93a1b5;font-family:"Segoe UI","Microsoft YaHei",sans-serif}

  const alive=f.units.filter(u=>Math.floor(u.id/3)===t).map(u=>u.pos?(u.flag!==null?'⚑':'●'):'○').join('');
  d.innerHTML=`<span><span class="sw" style="background:${C[t%15]}"></span>${esc(name(t))} <span class="muted">${alive}</span></span><b>${f.score[t]}</b>`;return d}));
 $('events').textContent=f.events.filter(e=>e.type!=='attack'||focus<0||Math.floor(e.unit/3)===focus).map(ev).join('\n')+(f.faults?'\n'+f.faults.map(x=>`程序故障 ${name(x.team)}：${x.reason}`).join('\n'):'')||'无';
 $('orders').textContent=Object.entries(f.orders).filter(([t])=>focus<0||+t===focus).map(([t,cs])=>`${name(+t)}：`+cs.map(c=>`${c.id} ${MV[c.move]??'停'}${AC[c.act]?' '+AC[c.act]:''}${c.act==='attack'?' '+c.target:''}${c.note?'「'+c.note+'」':''}`).join('，')).join('\n')||'—';
}
function star(x,y,r,col){g.fillStyle=col;g.beginPath();for(let k=0;k<10;k++){const a=Math.PI/5*k-Math.PI/2,rr=k%2?r*.45:r;g.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a))}g.fill()}
function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function go(k){playing=false;$('play').textContent='播放';i=Math.max(0,Math.min(R.frames.length-1,k));render()}
function tick(t){if(playing&&t-last>=300/+$('speed').value){last=t;if(i<R.frames.length-1){i++;render()}else go(i)}requestAnimationFrame(tick)}
if(R){
 $('sub').textContent=`${R.header.teams} 方 · 地图 ${R.header.size}×${R.header.size} · 种子 ${R.header.seed} · 最终得分 ${R.result.score.join(' / ')}`;
 $('seek').max=R.frames.length-1;
 R.frames.forEach((f,k)=>{const es=f.events.filter(e=>e.type==='capture'||(e.type==='death'&&e.flag!==null));if(es.length){const o=document.createElement('option');o.value=k;o.textContent=`${f.turn} 回合：${es.map(ev).join('；')}`;$('keys').append(o)}});
 $('play').onclick=()=>{if(i===R.frames.length-1)i=0;playing=!playing;$('play').textContent=playing?'暂停':'播放'};
 $('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('seek').oninput=e=>go(+e.target.value);$('keys').onchange=e=>{if(e.target.value!=='')go(+e.target.value)};
 addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);if(e.key===' '){e.preventDefault();$('play').click()}});
 render();requestAnimationFrame(tick)
}else $('sub').textContent='这是回放模板，请打开对战后生成的 HTML 文件。';
</script></body></html>
