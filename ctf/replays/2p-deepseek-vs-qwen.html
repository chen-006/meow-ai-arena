<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>夺旗回放</title>
<style>
:root{color-scheme:dark;--bg:#0f141c;--panel:#18202c;--line:#2a3547;--ink:#e6ecf5;--muted:#93a1b5;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;margin-bottom:12px}h1{font-size:22px;margin:0}.muted{color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:minmax(360px,1fr) 340px;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}

.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}

button{cursor:pointer}button:hover{background:#30405a}input[type=range]{flex:1;min-width:160px;padding:0}

.team b{font-size:16px}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
h2{font-size:13px;color:var(--muted);margin:12px 0 6px}#events,#orders{font-size:12px;line-height:1.7;max-height:190px;overflow:auto;white-space:pre-wrap}

</section>
